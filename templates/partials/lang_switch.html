{% load i18n %}
{% get_current_language as CURRENT_LANG %}
{% get_available_languages as LANGUAGES_LIST %}
<div class="lang-switch{% if lang_switch_class %} {{ lang_switch_class }}{% endif %}" role="group" aria-label="{% trans 'Jazyk' %}">
  {% for lang_code, lang_name in LANGUAGES_LIST %}
  <form action="{% url 'set_language' %}" method="post" class="lang-switch__form">
    {% csrf_token %}
    <input type="hidden" name="language" value="{{ lang_code }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button
      type="submit"
      class="lang-switch__btn{% if lang_code == CURRENT_LANG %} is-active{% endif %}"
      aria-label="{{ lang_name }}"
      {% if lang_code == CURRENT_LANG %}aria-current="true"{% endif %}
    >{% if lang_switch_labels == 'name' %}{{ lang_name }}{% else %}{{ lang_code|upper }}{% endif %}</button>
  </form>
  {% endfor %}
</div>
