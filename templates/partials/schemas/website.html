<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ SITE_NAME }}",
  "url": "{{ SITE_URL }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ SITE_URL }}/vyhledavani/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
