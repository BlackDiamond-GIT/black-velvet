databases:
  - name: black-velvet-db
    databaseName: black_velvet
    user: black_velvet
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: '18'

services:
  - type: web
    name: black-velvet
    runtime: python
    plan: starter
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn black_velvet.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /robots.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: black_velvet.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: black-velvet-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com,black-velvet.cz,www.black-velvet.cz
      - key: CSRF_TRUSTED_ORIGINS
        value: https://black-velvet.cz,https://www.black-velvet.cz
      - key: SITE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: info@black-velvet.cz
      - key: HUB_API_URL
        value: https://tantra-prague.com
      - key: HUB_API_KEY
        sync: false
